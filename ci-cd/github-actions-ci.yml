# STATUS: Working example for the build/test/package stages (valid GitHub Actions syntax).
# The deployment step at the bottom is PSEUDOCODE — it references placeholder secrets
# and a placeholder deploy action; it is not wired to any real Anypoint Platform account.
#
# Applies to each of the four Mule apps in ../mule-apps/ — shown here parameterized for
# order-process-api; the same workflow structure applies to the other three apps.

name: order-process-api-ci

on:
  push:
    branches: [main]
    paths:
      - "mule-apps/order-process-api/**"
  pull_request:
    branches: [main]
    paths:
      - "mule-apps/order-process-api/**"

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mule-apps/order-process-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Lint RAML spec
        run: |
          npx --yes raml-cli validate ../../api-specs/order-process-api.raml

      - name: Build (compile, no tests)
        run: mvn -B clean compile

      - name: Run MUnit tests
        run: mvn -B test

      - name: Package deployable artifact
        run: mvn -B clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: order-process-api-jar
          path: mule-apps/order-process-api/target/*.jar

